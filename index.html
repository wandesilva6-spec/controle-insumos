 const sel=(k,o)=>`<select onchange="gS.${k}=this.value;draw(1)">${o.map(([v,l])=>`<option value="${v}" ${g[k]==v?'selected':''}>${e(l)}</option>`).join('')}</select>`;
 return `<div class="c"><label>Gráfico</label>${sel('t',[['dia','Saídas por dia'],['es','Entradas x saídas por dia'],['col','Consumo por colaborador'],['ins','Consumo por insumo'],['est','Estoque atual (vermelho = abaixo do mínimo)']])}<label>Período</label>${sel('p',[['7','Últimos 7 dias'],['30','Últimos 30 dias'],['90','Últimos 90 dias'],['mes','Mês atual']])}<label>Insumo</label>${sel('i',[['','Todos'],...items.map(i=>[i.id,i.name])])}<label>Colaborador</label>${sel('c',[['','Todos'],...collabs.map(c=>[c.id,c.name])])}</div><div class="c r" style="align-items:flex-start"><div><div class="m">Saídas</div><b>${+sum(out).toFixed(1)}</b></div><div><div class="m">Entradas</div><b>${+sum(inn).toFixed(1)}</b></div><div><div class="m">Estoque baixo</div><b>${lowItems().length}</b></div><div><div class="m">Mais usa</div><b>${top?e(top.l):'—'}</b></div></div><div class="c">${ch}</div><p class="m">Insumos com unidades diferentes são somados. Para comparar a mesma unidade, filtre por insumo.</p>`},
avisos:()=>{const P=pendReq(),W=can('est')?lowItems():[],s=stockOf(),u=unread();return (P.length?`<div class="c"><b>Pedidos de acesso (${P.length})</b>${P.map(r=>`<div class="r"><span>${e(r.label||'Usuário')}</span><button onclick="acc('${r.id}')">Liberar</button></div>`).join('')}</div>`:'')+(W.length?`<div class="c low"><b>Estoque baixo</b>${W.map(i=>`<div class="r"><span>${e(i.name)}</span><span class="w">${s[i.id]||0} ${e(i.unit||'')} (mín. ${i.min||0})</span></div>`).join('')}</div>`:'')+(u?`<div class="c"><b>${u} conversa(s) com mensagem nova</b><div class="b"><button onclick="tab='chat';draw(1);openChat(curChat)">Abrir chat</button></div></div>`:'')||'<p class="m">Nenhum aviso no momento.</p>'},
chat:()=>{const L=convs(),c=L.find(x=>x.id==curChat)||L[0];return `<div class="c"><label>Conversa</label><select onchange="openChat(this.value)">${L.map(x=>`<option value="${x.id}" ${x.id==c.id?'selected':''}>${e(ttl(x))}${unreadOf(x)?' •':''}</option>`).join('')}</select><div class="b"><button onclick="newChat()">Nova conversa</button><button class="x" onclick="clearChat()">Apagar conversa</button></div></div><div class="c"><div style="max-height:50vh;overflow:auto;display:flex;flex-direction:column-reverse">${msgs.map(m=>`<div style="margin:6px 0;${m.by==ME.id?'text-align:right':''}"><div class="m">${e(nm(m.by))} · ${fmt(m.ts)}</div><div>${e(m.text)}</div>${m.by==ME.id||own?`<button class="x" style="padding:2px 8px;font-size:12px" onclick="delMsg('${m.id}')">apagar</button>`:''}</div>`).join('')||'<p class="m">Nenhuma mensagem.</p>'}</div></div><div class="c"><input id="cm" placeholder="Escreva uma mensagem" maxlength="500"><button onclick="sendMsg()">Enviar</button></div><p class="m">Aviso: a separação das conversas é feita pelo app. Quem tem conhecimento técnico e acesso ao app consegue ler conversas de outros. Não use para assuntos sigilosos.</p>`},

estoque:()=>{const s=stockOf();return `<datalist id="un">${['unidade','litro','pacote','caixa','rolo','metro','kg','par','fardo','galão'].map(u=>`<option>${u}`).join('')}</datalist>`+(items.length?items.map(i=>{const q=s[i.id]||0,lo=q<=(i.min||0);return `<div class="c ${lo?'low':''}"><div class="r"><div><b>${e(i.name)}</b><div class="m">mínimo ${i.min||0} ${e(i.unit||'')}</div>${lo?'<div class="w">Estoque baixo</div>':''}</div><div class="n">${q} <span class="m">${e(i.unit||'')}</span></div></div><div class="b">${can('mov')?`<button onclick="mv('${i.id}','in')">Entrada</button><button onclick="mv('${i.id}','out')">Saída</button>`:''}${can('ins')?`<button onclick="edI('${i.id}')">Editar</button>`:''}${can('exc')?`<button class="x" onclick="delI('${i.id}')">Excluir</button>`:''}</div></div>`}).join(''):`<p class="m">Nenhum insumo cadastrado.</p>${can('ins')?'<button onclick="seed()">Cadastrar insumos iniciais</button>':''}`)+(can('ins')?`<div class="c"><b>Novo insumo</b><input id="ni" placeholder="Nome do insumo"><input id="nu" list="un" placeholder="Unidade (unidade, litro, pacote, caixa...)"><input id="nm" type="number" inputmode="decimal" placeholder="Quantidade mínima (aviso)"><button onclick="addI()">Adicionar insumo</button></div>`:'')},
retirar:()=>collabs.length&&items.length?`<div class="c"><h3>Registrar retirada</h3><label>Colaborador</label><select id="rc">${optC(collabs)}</select><label>Insumo</label><select id="ri">${optI(items)}</select><label>Quantidade</label><input id="rq" type="number" min="0" step="any" value="1" inputmode="decimal"><button onclick="ret()">Registrar retirada</button></div><p class="m">Data e hora são registradas automaticamente.</p>`:'<p class="m">Nenhum colaborador ou insumo cadastrado. Peça ao administrador.</p>',
hist:()=>moves.slice(0,100).map(m=>`<div class="c"><b>${m.type=='in'?'Entrada':'Saída'}: ${m.qty} ${e(m.unit||'')} × ${e(m.iname)}</b><div class="m">${fmt(m.ts)}${m.cname?' · '+e(m.cname):''} · por ${e(nm(m.by))}</div>${(m.edits||[]).length?`<div class="m">Corrigido ${m.edits.length}x. Original: ${e(m.edits[0].old)}</div>`:''}<div class="b">${can('cor')?`<button onclick="edM('${m.id}')">Corrigir</button>`:''}${can('exc')?`<button class="x" onclick="rmM('${m.id}')">Excluir</button>`:''}</div></div>`).join('')||'<p class="m">Nenhuma movimentação ainda.</p>',
rank:()=>{const k=rkM||mo(Date.now()),g={};
 collabs.forEach(c=>g[c.id]={n:c.name,u:0,p:packs[k+'_'+c.id]||0,id:c.id});
 moves.filter(m=>m.type=='out'&&m.collab&&mo(m.ts)==k&&(!rkI||m.item==rkI)).forEach(m=>{const a=g[m.collab]=g[m.collab]||{n:m.cname,u:0,p:packs[k+'_'+m.collab]||0,id:m.collab};a.u+=m.qty});
 const q=a=>a.p?a.u/a.p:-1,L=Object.values(g).sort((a,b)=>(rkS=='r'?q(b)-q(a):b.u-a.u)||a.n.localeCompare(b.n));
 return `<div class="c"><label>Mês</label><input type="month" value="${k}" onchange="rkM=this.value;draw(1)"><label>Insumo</label><select onchange="rkI=this.value;draw(1)"><option value="">Todos os insumos</option>${items.map(i=>`<option value="${i.id}" ${rkI==i.id?'selected':''}>${e(i.name)}</option>`).join('')}</select><label>Ordenar por</label><select onchange="rkS=this.value;draw(1)"><option value="u">Total usado</option><option value="r" ${rkS=='r'?'selected':''}>Uso por pacote embalado</option></select></div>`+(L.map((a,i)=>`<div class="c ${i<4&&a.u>0?'top':''}"><div class="r"><span class="pos">${i+1}º</span><b>${e(a.n)}</b><div class="n">${a.u}</div></div><div class="m">${rkI?'uso do insumo escolhido':'itens usados'} no mês</div><label>Pacotes embalados (digite)</label><input type="number" min="0" inputmode="numeric" value="${a.p}" onchange="setP('${a.id}',this.value)"><div class="m">${a.p?(a.u/a.p).toFixed(1)+' por pacote':'Informe os pacotes para ver a média'}</div></div>`).join('')||'<p class="m">Cadastre colaboradores na aba Equipe.</p>')+'<p class="m">Os 4 que mais usam ficam em destaque.</p>'},
equipe:()=>`<div class="c"><b>Colaboradores</b>${collabs.map(c=>`<div class="r"><span>${e(c.name)}</span><button class="x" onclick="rmC('${c.id}')">Remover</button></div>`).join('')}<input id="nc" placeholder="Nome do colaborador"><button onclick="addC()">Adicionar colaborador</button></div>`+(own?`${LGC()}${SH()}<div class="c r"><span class="m">Aceitar novos pedidos: <b>${cfg.allowSignups?'Sim':'Não'}</b></span><button onclick="tgl()">${cfg.allowSignups?'Desligar':'Ligar'}</button></div><div class="c"><b>Pedidos de acesso</b>${reqs.filter(r=>!roles[r.id]).map(r=>`<div class="r"><span>${e(r.label||'Usuário')}</span><button onclick="acc('${r.id}')">Liberar</button></div>`).join('')||'<p class="m">Nenhum pedido.</p>'}</div><div class="c"><b>Acessos</b>${Object.keys(roles).map(id=>`<div class="r" style="margin-top:8px"><div><b>${e(nm(id))}</b><div class="m">${{geral:'geral',parcial:'parcial',simples:'simples'}[roles[id].role]} · ${{active:'ativo',blocked:'bloqueado'}[roles[id].status]||'ativo'}</div></div><button onclick="acc('${id}')">Acesso</button></div>`).join('')||'<p class="m">Nenhum acesso liberado ainda.</p>'}</div>`:''),conta:()=>`<div class="c"><b>${e(ME.email||'')}</b><div class="m">${own?'Administrador (proprietário)':{geral:'Administrador geral',parcial:'Parcial',simples:'Simples'}[my().role]}</div></div><div class="c"><b>Trocar senha</b><input id="pa" type="password" placeholder="Senha atual" autocomplete="current-password"><input id="pn" type="password" placeholder="Nova senha (mínimo 6)" autocomplete="new-password"><button onclick="chPw()">Trocar senha</button></div>${SH()}<button class="x" onclick="outU()">Sair</button>`};

/* ---------- ações ---------- */
function cp(){const f=()=>{dlg(`<p>Copie o link:</p><input id="lk" readonly value="${e(LINK)}"><div class="b"><button onclick="dlg()">OK</button></div>`);$('lk').select()};try{navigator.clipboard.writeText(LINK).then(()=>note('Link copiado!'),f)}catch(_){f()}}
function addMove(t,id,q,c){if(!(q>0))return note('Informe uma quantidade maior que zero.');const it=items.find(x=>x.id==id),cb=collabs.find(x=>x.id==c);return T(async()=>{const b=F.writeBatch(fdb);b.set(F.doc(F.collection(fdb,'moves')),{ts:Date.now(),type:t,item:id,iname:it.name,unit:it.unit||'',qty:q,collab:c||'',cname:cb?cb.name:'',by:ME.id,edits:[]});b.update(F.doc(fdb,'items',id),{stock:F.increment(t=='in'?q:-q)});await b.commit()})}
function mv(id,t){ask((t=='in'?'Entrada de ':'Saída de ')+items.find(x=>x.id==id).name,[{id:'q',l:'Quantidade',t:'number'}],v=>addMove(t,id,+v.q,''))}
function ret(){const q=+$('rq').value,id=$('ri').value,c=$('rc').value,it=items.find(x=>x.id==id),go=async()=>{await addMove('out',id,q,c);note('Retirada registrada.')};if(!(q>0))return note('Informe uma quantidade maior que zero.');q>(stockOf()[id]||0)?sure('A quantidade é maior que o estoque. Registrar mesmo assim?',go):go()}
function addI(){const n=$('ni').value.trim();if(!n)return note('Digite o nome do insumo.');T(()=>DB.collection('items').add({name:n,unit:$('nu').value.trim()||'unidade',min:+$('nm').value||0,stock:0}))}
function seed(){T(async()=>{for(const n of['Durex','Sacos de lixo','Envelopes de envio','Rolo de sulfilme preto','Rolo de sulfilme transparente','Rolo de papelão','Rolo de plástico bolha','Etiqueta zebra'])await DB.collection('items').add({name:n,unit:/^Rolo/.test(n)?'rolo':'unidade',min:2,stock:0})})}
function edI(id){const i=items.find(x=>x.id==id);ask('Editar insumo',[{id:'n',l:'Nome',v:i.name},{id:'u',l:'Unidade (unidade, litro, pacote, caixa...)',v:i.unit||''},{id:'m',l:'Quantidade mínima',t:'number',v:i.min||0}],v=>T(()=>DB.doc('items/'+id).update({name:v.n.trim()||i.name,unit:v.u.trim(),min:+v.m||0})))}
function delI(id){sure('Excluir este insumo? O histórico dele continua guardado.',()=>sens(()=>T(()=>DB.doc('items/'+id).delete())))}
function edM(id){const m=moves.find(x=>x.id==id);ask('Corrigir movimentação',[{id:'q',l:'Quantidade',t:'number',v:m.qty},{id:'d',l:'Data e hora (dd/mm/aaaa hh:mm)',v:fmt(m.ts)}],v=>T(async()=>{const q=+v.q;if(!(q>0))return note('Informe uma quantidade maior que zero.');const r=/(\d+)\/(\d+)\/(\d+)\D+(\d+):(\d+)/.exec(v.d||'');let ts=m.ts;if(r)ts=new Date(+r[3],r[2]-1,+r[1],+r[4],+r[5]).getTime();const b=F.writeBatch(fdb);b.update(F.doc(fdb,'moves',id),{qty:q,ts,edits:[...(m.edits||[]),{ts:Date.now(),by:ME.id,old:m.qty+' em '+fmt(m.ts)}]});if(items.some(x=>x.id==m.item))b.update(F.doc(fdb,'items',m.item),{stock:F.increment((m.type=='in'?1:-1)*(q-m.qty))});await b.commit()}))}
function rmM(id){sure('Excluir esta movimentação? O estoque será ajustado.',()=>sens(()=>T(async()=>{const m=moves.find(x=>x.id==id),b=F.writeBatch(fdb);b.set(F.doc(F.collection(fdb,'audit')),{ts:Date.now(),by:ME.id,m});b.delete(F.doc(fdb,'moves',id));if(items.some(x=>x.id==m.item))b.update(F.doc(fdb,'items',m.item),{stock:F.increment((m.type=='in'?-1:1)*m.qty)});await b.commit()})))}
function addC(){const n=$('nc').value.trim();if(n)T(()=>DB.collection('collabs').add({name:n}))}
function rmC(id){sure('Remover colaborador? O histórico dele continua guardado.',()=>T(()=>DB.doc('collabs/'+id).delete()))}
function setP(id,v){T(()=>DB.doc('packs/'+(rkM||mo(Date.now()))+'_'+id).set({n:Math.max(0,+v||0)}))}
function acc(id){const r=roles[id]||{role:'simples',perms:{},status:'active'},lb=(roles[id]&&roles[id].label)||(reqs.find(x=>x.id==id)||{}).label||'';
 dlg(`<h3>${e(nm(id))}</h3><label>Nível</label><select id="ar"><option value="simples">Simples (só retirada)</option><option value="parcial">Parcial (você escolhe)</option><option value="geral">Geral (faz tudo, menos liberar acessos)</option></select><label>Permissões do nível Parcial</label>${PL.map(([k,l])=>`<label class="ck"><input type="checkbox" id="pk_${k}" ${(r.perms||{})[k]?'checked':''}> ${l}</label>`).join('')}<label>Situação</label><select id="as"><option value="active">Ativo</option><option value="blocked">Bloqueado</option></select><div class="b"><button id="ok">Salvar</button><button class="x" onclick="dlg()">Cancelar</button></div>`);
 $('ar').value=r.role;$('as').value=r.status||'active';
 $('ok').onclick=()=>{const role=$('ar').value,s=$('as').value,perms={};PL.forEach(([k])=>{if($('pk_'+k).checked)perms[k]=true});dlg();sens(()=>T(async()=>{await DB.doc('roles/'+id).set({role,perms,status:s,label:lb});await DB.doc('people/'+id).set({name:lb||'Usuário',status:s});await DB.doc('requests/'+id).delete().catch(()=>{})}))}}
const gS={t:'dia',p:'30',i:'',c:''},dk=d=>d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
function days(p){const n=new Date();n.setHours(0,0,0,0);const a=p=='mes'?new Date(n.getFullYear(),n.getMonth(),1):new Date(n.getTime()-(+p-1)*864e5),r=[];for(let d=new Date(a);d<=n;d.setDate(d.getDate()+1))r.push(new Date(d));return r}
function svgCols(D,S){const W=320,H=160,L=30,B=20,T0=8,mx=Math.max(1,...S.flatMap(s=>s.v)),n=D.length,bw=(W-L)/n,sw=bw/S.length,ph=H-B-T0;
 let g=`<text x="0" y="${T0+8}" font-size="10" fill="currentColor">${+mx.toFixed(1)}</text><line x1="${L}" y1="${H-B}" x2="${W}" y2="${H-B}" stroke="currentColor" opacity=".3"/>`;
 S.forEach((s,j)=>s.v.forEach((v,i)=>{const h=v/mx*ph;g+=`<rect x="${(L+i*bw+j*sw).toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${Math.max(1,sw-.6).toFixed(1)}" height="${h.toFixed(1)}" fill="${s.c}"/>`}));
 const k=Math.ceil(n/6);D.forEach((d,i)=>{if(i%k==0)g+=`<text x="${(L+i*bw).toFixed(1)}" y="${H-5}" font-size="9" fill="currentColor">${d.getDate()}/${d.getMonth()+1}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico">${g}</svg>${S.length>1?'<div class="m">'+S.map(s=>`<span style="color:${s.c}">■</span> ${s.n}`).join(' &nbsp; ')+'</div>':''}`}
function svgBars(d){if(!d.length)return '<p class="m">Sem dados para este filtro.</p>';const mx=Math.max(1,...d.map(x=>x.v)),h=28;return `<svg viewBox="0 0 320 ${d.length*h+4}" width="100%" role="img" aria-label="Gráfico"><g font-size="11" fill="currentColor">${d.map((x,i)=>`<text x="0" y="${i*h+16}">${e(String(x.l).slice(0,17))}</text><rect x="112" y="${i*h+4}" width="${Math.max(2,x.v/mx*165).toFixed(1)}" height="16" rx="3" fill="${x.c||'var(--ac)'}"/><text x="${(116+x.v/mx*165).toFixed(1)}" y="${i*h+16}">${+x.v.toFixed(1)}</text>`).join('')}</g></svg>`}
const convs=()=>[{id:'geral',kind:'all',last:geral.last},...chats.filter(c=>c.id!='geral'&&(c.members||[]).includes(ME.id)).sort((a,b)=>((b.last||{}).ts||0)-((a.last||{}).ts||0))];
const ttl=c=>c.id=='geral'?'Todos (grupo geral)':c.kind=='dm'?nm((c.members||[]).find(x=>x!=ME.id)):(c.title||(c.members||[]).filter(x=>x!=ME.id).map(nm).join(', ')),unreadOf=c=>!!c.last&&c.last.ts>(seenMap[c.id]||0)&&c.last.by!=ME.id,unread=()=>convs().filter(unreadOf).length;
const lowItems=()=>{const s=stockOf();return items.filter(i=>(s[i.id]||0)<=(i.min||0))},pendReq=()=>own?reqs.filter(r=>!roles[r.id]):[];
const bd=k=>{const n=k=='chat'?unread():k=='avisos'?pendReq().length+(can('est')?lowItems().length:0)+unread():0;return n?` (${n})`:''};
function openChat(cid){curChat=cid;msgUn&&msgUn();msgs=[];msgUn=DB.collection('chats/'+cid+'/msgs').orderBy('ts','desc').limit(100).onSnapshot(s=>{msgs=arr(s);markSeen();draw()},()=>{});draw(1)}
function markSeen(){const c=convs().find(x=>x.id==curChat);if(tab!='chat'||!c||!c.last||c.last.ts<=(seenMap[c.id]||0)||sw)return;sw=1;seenMap={...seenMap,[c.id]:c.last.ts};SD.set({seen:seenMap}).catch(()=>{}).then(()=>{sw=0})}
function sendMsg(){const t=$('cm').value.trim();if(!t)return;const ts=Date.now(),c=curChat;T(async()=>{await DB.collection('chats/'+c+'/msgs').add({ts,by:ME.id,text:t.slice(0,500)});const last={ts,by:ME.id};if(c=='geral')await DB.doc('chats/geral').set({kind:'all',last});else await DB.doc('chats/'+c).update({last});$('cm').value=''})}
function delMsg(id){T(()=>DB.doc('chats/'+curChat+'/msgs/'+id).delete())}
function clearChat(){const c=curChat;if(c=='geral'&&!own)return note('Só o administrador apaga o grupo geral.');sure(c=='geral'?'Apagar todas as mensagens do grupo geral para todos?':'Apagar esta conversa para todos os participantes?',()=>T(async()=>{const q=await DB.collection('chats/'+c+'/msgs').get();for(const d of q.docs)await DB.doc('chats/'+c+'/msgs/'+d.id).delete();if(c!='geral'){await DB.doc('chats/'+c).delete();openChat('geral')}}))}
function newChat(){const ids=Object.keys(people).filter(id=>people[id].status=='active'&&id!=ME.id);
 if(!ids.length)return note('Ainda não há outras pessoas liberadas.');
 dlg(`<h3>Nova conversa</h3><p class="m">Escolha uma pessoa (conversa privada) ou várias (grupo).</p>${ids.map(id=>`<label class="ck"><input type="checkbox" class="nc" value="${id}"> ${e(nm(id))}</label>`).join('')}<label>Nome do grupo (opcional)</label><input id="gt" placeholder="Ex.: Embalagem"><div class="b"><button id="ok">Criar</button><button onclick="dlg();openChat('geral')">Grupo geral (todos)</button><button class="x" onclick="dlg()">Cancelar</button></div>`);
 $('ok').onclick=()=>{const sel=[...document.querySelectorAll('.nc')].filter(x=>x.checked).map(x=>x.value),gt=$('gt').value.trim();if(!sel.length)return note('Escolha ao menos uma pessoa.');const mem=[ME.id,...sel].sort(),dm=mem.length==2,id=dm?'dm_'+mem.join('_'):'g_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);dlg();T(async()=>{if(!chats.find(c=>c.id==id))await DB.doc('chats/'+id).set(dm?{kind:'dm',members:mem,by:ME.id}:{kind:'group',members:mem,title:gt,by:ME.id});openChat(id)})}}
function SH(){const t='Acesse o Controle de Insumos: '+LINK+' (crie sua conta com e-mail e senha, confirme o e-mail e toque em Pedir liberação)';return `<div class="c"><b>Convidar pessoas</b><p class="m">Envie este link. A pessoa cria a conta, confirma o e-mail e pede liberação; você aprova em Equipe, Pedidos de acesso.</p><div class="b"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t)}">Enviar pelo WhatsApp</a><button onclick="cp()">Copiar link</button></div></div>`}
init();
</script></body></html>
